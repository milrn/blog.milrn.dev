---
layout: default
---
<div class="simple-page">
  <header class="page-heading"><h1>Tags</h1></header>
  {% assign sorted_tags = site.tags | sort_tags %}
  <ul class="tag-cloud">
    {% for tag in sorted_tags %}
      <li><a class="tag-chip" href="{{ '/tags/' | relative_url }}{{ tag[0] | slugify }}/">{{ tag[0] }}</a></li>
    {% endfor %}
  </ul>
</div>
