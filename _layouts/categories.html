---
layout: default
---
<div class="simple-page">
  <header class="page-heading"><h1>Categories</h1></header>
  <ul class="term-list">
    {% for category in page.paged_terms %}
      <li><a href="{{ '/categories/' | relative_url }}{{ category[0] | slugify }}/">{{ category[0] }}</a></li>
    {% endfor %}
  </ul>
  {% include pagination.html pagination=page.pagination label='Category pages' %}
</div>
